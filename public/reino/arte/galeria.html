<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keepmile - pilot art gallery</title>
<style>
  body { margin: 0; padding: 12px 16px 60px; background: #68a862; color: #fff6e0; font: 14px/1.4 system-ui, sans-serif; }
  body.estrada { background: #cda068; } body.noite { background: #2b1e3a; } body.claro { background: #f2ead8; color: #2b1e3a; }
  h1 { font-size: 20px; margin: 4px 0 2px; } h2 { font-size: 15px; margin: 22px 0 4px; padding: 4px 8px; background: #2b1e3a; color: #fff6e0; border-radius: 3px; }
  .nota { margin: 2px 0 8px; opacity: .85; font-size: 12px; }
  .grade { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .peca { background: rgba(43, 30, 58, .16); border-radius: 4px; padding: 6px 8px; max-width: 100%; overflow-x: auto; }
  .titulo { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
  .faixa { height: 3px; width: 60px; margin-bottom: 4px; }
  .linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .legenda { font-size: 10px; opacity: .8; text-align: center; }
  canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  select { font: inherit; }
</style>
</head>
<body>
<h1>Keepmile - pilot art gallery</h1>
<label>Background
  <select id="fundo">
    <option value="">grass</option><option value="estrada">road</option><option value="noite">night</option><option value="claro">paper</option>
  </select>
</label>
<div id="galeria"></div>
<script src="atlas.js"></script>
<script src="galeria.js"></script>
</body>
</html>
